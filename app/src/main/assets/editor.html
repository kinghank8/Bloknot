<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
:root{color-scheme:light;--paper:#fffdf7;--ink:#28352c;--muted:#777d70;--line:#e6e3d7;--green:#36583c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f5ec;color:var(--ink);font-family:Roboto,"Noto Sans",Arial,sans-serif}
main{padding:8px 14px 30px;max-width:820px;margin:0 auto}
.meta{font-size:12px;color:var(--muted);padding:7px 4px 12px}
#title{font-size:23px;font-weight:700;outline:none;padding:12px 12px 7px;background:var(--paper);border-radius:14px 14px 0 0;min-height:52px}
#editor{background:var(--paper);min-height:68vh;padding:4px 12px 24px;border-radius:0 0 14px 14px;outline:none;font-size:17px;line-height:1.65;overflow-wrap:anywhere}
#editor:empty:before{content:'Начните писать…';color:#a3a596;pointer-events:none}
#editor img{display:block;max-width:100%;height:auto;border-radius:10px;margin:12px auto;box-shadow:0 2px 10px #24332218}
#editor p{margin:8px 0} .hint{font-size:12px;color:var(--muted);text-align:center;padding:12px}
</style>
</head>
<body><main>
<div class="meta" id="dateLine"></div>
<div id="title" contenteditable="true" role="textbox" aria-label="Заголовок записи">Новая запись</div>
<div id="editor" contenteditable="true" role="textbox" aria-label="Текст записи"><p></p></div>
<div class="hint">Изменения сохраняются автоматически на устройстве</div>
</main>
<script>
const title=document.getElementById('title'), editor=document.getElementById('editor');
document.getElementById('dateLine').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
let saveTimer=null,ready=false;
function documentHtml(){return '<!doctype html><html lang="ru"><head><meta charset="utf-8"></head><body><h1>'+title.innerHTML+'</h1><div>'+editor.innerHTML+'</div></body></html>';}
function saveNow(){if(!window.AndroidNote)return;window.AndroidNote.saveHtml(documentHtml());}
function changed(){if(!ready)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500);}
title.addEventListener('input',changed);editor.addEventListener('input',changed);
function insertImage(dataUrl){const img=document.createElement('img');img.src=dataUrl;img.alt='Фотография';const sel=window.getSelection();let range;if(sel&&sel.rangeCount){range=sel.getRangeAt(0);if(editor.contains(range.commonAncestorContainer)){range.deleteContents();range.insertNode(img);range.setStartAfter(img);range.setEndAfter(img);sel.removeAllRanges();sel.addRange(range);}else{editor.appendChild(img);}}else{editor.appendChild(img);}const p=document.createElement('p');p.innerHTML='<br>';img.after(p);changed();}
window.addEventListener('load',()=>{try{const saved=window.AndroidNote&&window.AndroidNote.loadHtml();if(saved){const doc=new DOMParser().parseFromString(saved,'text/html');const h=doc.querySelector('h1');const body=doc.body; if(h)title.innerHTML=h.innerHTML;const div=body.querySelector('div');if(div)editor.innerHTML=div.innerHTML;} }catch(e){} ready=true;});
</script></body></html>
